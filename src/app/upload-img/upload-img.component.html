<h1> uPload my pictures </h1>
<label for="Image"> Image File </label> <br>    

<input type="file" (change)="upload($event)"  > <br>
<div class="uk-inline">

<img class="uk-border-pill" *ngIf="selectedFile" [src]="selectedFile"  width="200" height="200" alt="Photo choisie" >
<img class="uk-border-pill" *ngIf="!selectedFile" src="assets/images/avatarP.png"  width="200" height="200" alt="Image par défaut" >
</div><br>
<button (click)="uploadFile()" > upload </button>
